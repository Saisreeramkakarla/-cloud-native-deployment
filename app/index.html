<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Native Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 15px;
        }
        h1 { color: #38bdf8; }
        p { color: #cbd5e1; line-height: 1.7; }
        .status {
            display: inline-block;
            padding: 10px 20px;
            background: #14532d;
            color: #86efac;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud-Native Application</h1>
        <p>Automated deployment using AWS, Terraform, Docker and GitHub Actions.</p>
        <p class="status">Application Running Successfully</p>
        <p>Infrastructure as Code | CI/CD | Monitoring</p>
    </div>
</body>
</html>
